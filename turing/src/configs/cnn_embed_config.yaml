seed: 541

model:
  backbone: "resnet18"
  weights: "IMAGENET1K_V1"
  # Written by scripts/06_build_label_embeddings.py; relative to the data prep embeddings/ folder.
  embedding_paths:
    Word2Vec: "seen_Word2Vec.pt"
    BERT: "seen_BERT.pt"
  embedding_archive: "label_embeddings.npz"

data:
  manifest: "imagenet.parquet"
  seen_classes: "seen.json"
  num_workers: 0

training_args:
  batch_size: 32
  epochs: 20

hyperparameters:
  learning_rate: 0.0001
