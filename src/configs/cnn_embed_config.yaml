seed: 541

model:
  backbone: "resnet18"
  weights: "IMAGENET1K_V1"
  # Written by scripts/06_build_label_embeddings.py; relative to the data prep embeddings/ folder.
  embedding_paths:
    Word2Vec: "/home/bjpeters/archive/ImageNet/embeddings/word2vec.pt"
    BERT: "/home/bjpeters/archive/ImageNet/embeddings/bert.pt"

data:
  datafile: "imagenet_train.csv"
  test_split: 0.2
  val_split: 0.1

training_args:
  batch_size: 32
  epochs: 20

hyperparameters:
  learning_rate: 0.0001
